plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Signing state, read once at script level so both the android block below and the
// task-graph check at the end of this file can see it. KEYSTORE_PATH unset is a decision
// to build unsigned (CI does this when no keystore secret exists) and is announced;
// KEYSTORE_PATH set to something that is not there is a mistake - a typo, a keystore not
// copied onto the build machine - and it used to fall through to the unsigned path exactly
// as an unset one did, so the first sign of trouble was the Play upload.
def keystorePath = System.getenv("KEYSTORE_PATH")
def keystoreConfigured = keystorePath != null && !keystorePath.isEmpty()
def keystoreMissing = keystoreConfigured && !file(keystorePath).exists()

android {
    namespace 'com.kavopdf.app'
    // Play requires API 36 for every new app and every update since 31 Aug 2026
    // (extension to 1 Nov 2026 also passed), so compileSdk and targetSdk are both 36.
    // Raising targetSdk alone would not compile: compileSdk is what resolves the APIs.
    compileSdk 36
    buildToolsVersion "36.0.0"

    defaultConfig {
        applicationId "com.kavopdf.app"
        minSdk 24
        targetSdk 36

        // Only English. The app has no translations of its own - res/ has just values and
        // values-night - but resources.arsc was carrying about 120 languages of strings
        // from material, appcompat and the rest, which the app can never show. Dropping
        // them changes nothing that is displayed and takes roughly a megabyte off the APK.
        // If a translation is ever added, its folder has to be added here too.
        resConfigs "en"
        versionCode 297
        versionName "3.53.7"

        ndk {
            // Real phones are ARM; x86_64 exists so the app can be installed on the
            // emulator that the automated pipeline converts documents on.
            //
            // DECIDED 2026-11-09: the x86_64 slice is included in the SHIPPING apk, not
            // in a separate test build. The reason is that a test build is not the thing
            // the user runs, and "the fix shipped" has to be proven on the artefact that
            // ships. The cost is real and was measured rather than guessed: the ARM-only
            // apk is 38 MB and the comment here previously estimated +22 MB for the extra
            // slice, so expect roughly 60 MB.
            //
            // If that becomes unacceptable, the right answer is an Android App Bundle for
            // Play (per-device ABI delivery) rather than dropping x86_64 - dropping it
            // would make the pipeline unable to test the app at all.
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'
        }
        vectorDrawables { useSupportLibrary true }
    }

    signingConfigs {
        release {
            if (keystoreConfigured && !keystoreMissing) {
                storeFile file(keystorePath)
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (keystoreConfigured && !keystoreMissing) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }

    buildFeatures { viewBinding true
        buildConfig true }

    packaging {
        resources {
            excludes += [
                    'META-INF/versions/**',
                    'META-INF/DEPENDENCIES',
                    'META-INF/LICENSE*',
                    'META-INF/NOTICE*',
                    'META-INF/INDEX.LIST',
                    'META-INF/*.kotlin_module',
                    'module-info.class',
                    // BouncyCastle ships the SIKE and Picnic lookup tables (~4 MB in the
                    // APK). Those are post-quantum algorithms; PDF signing here uses
                    // RSA/ECDSA, so the tables are never read. Dropping them changes
                    // nothing at runtime.
                    'org/bouncycastle/pqc/**'
            ]
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.14.0'
    // camera preview + capture, and the offline barcode reader
    implementation 'androidx.camera:camera-core:1.5.0'
    implementation 'androidx.camera:camera-camera2:1.5.0'
    implementation 'androidx.camera:camera-lifecycle:1.5.0'
    implementation 'androidx.camera:camera-view:1.5.0'
    implementation 'com.google.mlkit:barcode-scanning:17.3.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'
    implementation 'androidx.activity:activity-ktx:1.10.1'
    implementation 'androidx.fragment:fragment-ktx:1.8.9'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.9.4'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.9.4'
    implementation 'androidx.documentfile:documentfile:1.1.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
    implementation 'com.tom-roush:pdfbox-android:2.0.27.0'
    // On-device OCR. The model is bundled in the APK: fully offline, no
    // Google Play Services and no extra permissions.
    implementation 'com.google.mlkit:text-recognition:16.0.1'
}

// A release build that is not signed cannot be uploaded, and it used to say nothing: the
// signingConfig was simply left unset and Gradle produced app-release-unsigned.apk with a
// green build. Now a KEYSTORE_PATH that is set but does not resolve fails the release
// build, where the cause is obvious, and a release build with no keystore at all says so
// in the log - CI builds unsigned on purpose when the keystore secret is absent, so that
// case warns rather than fails.
gradle.taskGraph.whenReady { graph ->
    def buildingRelease = graph.allTasks.any { it.name.toLowerCase().contains("release") }
    if (!buildingRelease) return
    if (keystoreMissing) {
        throw new GradleException("KEYSTORE_PATH is set to '" + keystorePath + "' but no file "
                + "exists there, so this release build would be unsigned and could not be "
                + "uploaded. Point KEYSTORE_PATH at the keystore, or unset it to build "
                + "unsigned on purpose.")
    }
    if (!keystoreConfigured) {
        logger.warn("KAVOPDF: KEYSTORE_PATH is not set, so this release build is UNSIGNED "
                + "(app-release-unsigned.apk) and cannot be uploaded to Play.")
    }
}
