plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.kavopdf.app'
    compileSdk 35
    buildToolsVersion "35.0.0"

    defaultConfig {
        applicationId "com.kavopdf.app"
        minSdk 24
        targetSdk 35

        // Only English. The app has no translations of its own - res/ has just values and
        // values-night - but resources.arsc was carrying about 120 languages of strings
        // from material, appcompat and the rest, which the app can never show. Dropping
        // them changes nothing that is displayed and takes roughly a megabyte off the APK.
        // If a translation is ever added, its folder has to be added here too.
        resConfigs "en"
        versionCode 184
        versionName "3.38.0"

        ndk {
            // Real phones are ARM. The x86/x86_64 slices only exist for emulators
            // and would add ~22 MB to the download.
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
        vectorDrawables { useSupportLibrary true }
    }

    signingConfigs {
        release {
            def path = System.getenv("KEYSTORE_PATH")
            if (path != null && !path.isEmpty() && file(path).exists()) {
                storeFile file(path)
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            def ks = System.getenv("KEYSTORE_PATH")
            if (ks != null && !ks.isEmpty() && file(ks).exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }

    buildFeatures { viewBinding true
        buildConfig true }

    packaging {
        resources {
            excludes += [
                    'META-INF/versions/**',
                    'META-INF/DEPENDENCIES',
                    'META-INF/LICENSE*',
                    'META-INF/NOTICE*',
                    'META-INF/INDEX.LIST',
                    'META-INF/*.kotlin_module',
                    'module-info.class',
                    // BouncyCastle ships the SIKE and Picnic lookup tables (~4 MB in the
                    // APK). Those are post-quantum algorithms; PDF signing here uses
                    // RSA/ECDSA, so the tables are never read. Dropping them changes
                    // nothing at runtime.
                    'org/bouncycastle/pqc/**'
            ]
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.14.0'
    // camera preview + capture, and the offline barcode reader
    implementation 'androidx.camera:camera-core:1.5.0'
    implementation 'androidx.camera:camera-camera2:1.5.0'
    implementation 'androidx.camera:camera-lifecycle:1.5.0'
    implementation 'androidx.camera:camera-view:1.5.0'
    implementation 'com.google.mlkit:barcode-scanning:17.3.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'
    implementation 'androidx.activity:activity-ktx:1.10.1'
    implementation 'androidx.fragment:fragment-ktx:1.8.9'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.9.4'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.9.4'
    implementation 'androidx.documentfile:documentfile:1.1.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
    implementation 'com.tom-roush:pdfbox-android:2.0.27.0'
    // On-device OCR. The model is bundled in the APK: fully offline, no
    // Google Play Services and no extra permissions.
    implementation 'com.google.mlkit:text-recognition:16.0.1'
}
