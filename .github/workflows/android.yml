name: Android CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # The regression gate, on every push.
  #
  # gate.py compares 208 converted documents against base208.json and fails on any
  # document that got worse. It was not in CI, and on 7 Nov a change to a tool script
  # was committed, reverted by a later commit from a stale copy, and nothing noticed
  # until it was read by hand.
  #
  # This is the job that makes a regression unable to ship: if a document gets worse,
  # this fails, the build job is not reached, and no APK is published.
  # ---------------------------------------------------------------------------
  regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0      # google-gate.sh asks git for the engine commit

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install the measurement libraries
        run: pip install pymupdf lxml

      - name: Get the corpus
        run: |
          set -e
          mkdir -p /tmp/corpus /tmp/zips
          curl -sL -o /tmp/zips/v3.zip  https://github.com/kavopdf/app/releases/download/corpus-v1/pdf-to-word-test-corpus-v3.zip
          curl -sL -o /tmp/zips/b80.zip https://github.com/kavopdf/app/releases/download/corpus-v1/p2w-batch-1.zip
          curl -sL -o /tmp/zips/g53.zip https://github.com/kavopdf/app/releases/download/corpus-v1/p2w-all-groups.zip
          for n in v3 b80 g53; do
            unzip -qo /tmp/zips/$n.zip -d /tmp/zips/$n
            find /tmp/zips/$n -name '*.pdf' -exec cp {} /tmp/corpus/ \;
          done
          count=$(ls /tmp/corpus/*.pdf 2>/dev/null | wc -l)
          echo "corpus: $count documents"
          if [ "$count" -lt 200 ]; then
            echo "Expected 208 documents and got $count. The corpus did not download."
            echo "A gate that runs on an empty corpus passes everything, so this fails."
            exit 1
          fi

      # ---------------------------------------------------------------------
      # An engine change must carry its evidence in the same commit.
      #
      # The fixer prompt says "do not commit without the ratchet". A prompt is a
      # promise; this is the check that makes it a fact. "I ran the ratchet" is a
      # claim, "RATCHET.json changed in the same commit as the engine" is evidence,
      # and evidence cannot be misremembered at 3am.
      #
      # A commit that fails this is visible forever, and the build job is never
      # reached, so nothing that skipped its proof can ever ship.
      # ---------------------------------------------------------------------
      - name: An engine change must carry its evidence
        run: |
          set -e
          ENGINE=app/src/main/java/com/kavopdf/app/engine
          BASE=$(git rev-parse HEAD~1 2>/dev/null || echo "")
          if [ -z "$BASE" ]; then
            echo "no parent commit - first commit, nothing to compare"; exit 0
          fi
          if git diff --quiet "$BASE" HEAD -- "$ENGINE"; then
            echo "engine unchanged in this commit - no evidence required"; exit 0
          fi
          echo "engine changed - checking the evidence travelled with it"
          MISSING=0
          for f in BASELINE.md RESULTS.jsonl RATCHET.json; do
            if git diff --quiet "$BASE" HEAD -- "tools/p2w-bench/$f"; then
              echo "FAIL  tools/p2w-bench/$f did not change in the same commit"
              MISSING=1
            else
              echo "ok    $f changed with the engine"
            fi
          done
          if [ "$MISSING" -ne 0 ]; then
            echo ""
            echo "An engine change with no measurement is a fix nobody checked."
            echo "Commit the numbers with the code, or revert the engine."
            exit 1
          fi

      # ---------------------------------------------------------------------
      # The gates that see what gate.py cannot.
      #
      # gate.py scores blank, blocks, extra, lines, missing, nobg, pages and
      # reflines. Not one of those moves when text lands in the wrong place - the
      # w:framePr change passed this gate, shipped as 3.53.5 and broke the stamp on
      # the phone with every count identical. base208.json has no position field at
      # all, so this gate can never see a position regression no matter how the
      # thresholds are set.
      #
      # ratchet.py is the one that can: it holds, per document, the best score ever
      # reached AND the set of failing checks at that point, and fails if either
      # falls. It reads committed files only, so it runs here without a network.
      #
      # It is not a substitute for the Google render - only a Drive round trip can
      # see what Docs does - but it stops a commit that lowers a document's record,
      # and that is free.
      # ---------------------------------------------------------------------
      - name: Ratchet - no document may fall below its best ever record
        run: |
          set -e
          python3 tools/p2w-bench/ratchet.py --check
          bash tools/p2w-bench/google-gate.sh

      - name: Verify the engine and record its classpath
        run: bash tools/verify-engine.sh

      - name: Convert the corpus and run the gate
        run: |
          set -e
          mkdir -p /tmp/docx
          # verify-engine.sh works from tools/engine-verify and leaves a classpath
          # relative to that folder, so the converter must run there too.
          cd tools/engine-verify
          CP=$(cat /tmp/engine-cp.txt)
          javac -nowarn -cp "$CP" -d out ConvertAll.java
          java -cp "$CP" ConvertAll /tmp/corpus /tmp/docx
          cd "$GITHUB_WORKSPACE"
          converted=$(ls /tmp/docx/*.docx 2>/dev/null | wc -l)
          echo "converted: $converted documents"
          python3 tools/p2w-bench/gate.py --corpus /tmp/corpus --out /tmp/docx \
                  --baseline tools/p2w-bench/base208.json --check

  build:
    needs: regression
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Ensure Android SDK packages
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)"
          echo "sdkmanager=$SDKMANAGER"
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
            yes | "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0" "platforms;android-35" "build-tools;35.0.0" "platforms;android-34" "build-tools;34.0.0" >/dev/null 2>&1 || true
          fi
          echo "Installed platforms:"; ls "$ANDROID_HOME/platforms" || true
          echo "Installed build-tools:"; ls "$ANDROID_HOME/build-tools" || true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-v3-${{ hashFiles('**/*.gradle', 'gradle.properties') }}
          restore-keys: gradle-v3-

      # A developer machine's proxy must never be committed: on a runner the host does
      # not resolve and every repository request fails, which shows up much later as
      # "plugin could not be resolved".
      - name: Guard - no proxy settings committed
        run: |
          if grep -qiE '^systemProp\.(http|https)\.proxy' gradle.properties; then
            echo "gradle.properties contains a proxy - remove it before pushing."
            exit 1
          fi
          echo "gradle.properties is clean"

      - name: Install Gradle 8.11.1
        run: |
          # AGP 8.9.1, needed for compileSdk 36, requires Gradle 8.11.1 or newer.
          curl -sSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.11.1-bin.zip
          unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.11.1/bin" >> "$GITHUB_PATH"

      - name: Verify PDF engine against real PDFBox (39 checks)
        run: bash tools/verify-engine.sh

      - name: Decode signing keystore
        run: |
          if [ -n "${KEYSTORE_BASE64}" ]; then
            echo "${KEYSTORE_BASE64}" | base64 -d > "${RUNNER_TEMP}/release.jks"
            # Exported only when the file really is there: the build fails a release when
            # KEYSTORE_PATH is set and does not resolve, so an empty secret must leave it
            # unset rather than pointing at a file that was never written.
            echo "KEYSTORE_PATH=${RUNNER_TEMP}/release.jks" >> "$GITHUB_ENV"
            echo "Keystore decoded."
          else
            echo "No keystore secret found; the APK will be built unsigned and the build says so."
          fi
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Build signed release APK
        env:
          # KEYSTORE_PATH comes from the decode step above, and only when the keystore
          # really exists - a path that does not resolve now fails the release build.
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Guard - every layout is well-formed
        run: python3 tools/check-layouts.py

      - name: Guard - every tool has a heading
        run: python3 tools/check-tool-titles.py

      - name: Guard - nothing inside a save producer touches the UI
        run: python3 tools/check-main-thread.py

      - name: Guard - PDF to Word keeps its extraction stages and wiring
        run: python3 tools/check-pdf2word.py

      - name: Guard - nothing ships in the APK that the APK does not use
        run: python3 tools/check-dead-classes.py

      - name: Guard - no unexpected permissions
        run: |
          python3 -m pip install --quiet pyaxmlparser
          python3 tools/check-permissions.py

      - name: Guard - launcher background is the intended colour
        run: |
          # The APK is app-release.apk when a signing key is configured and
          # app-release-unsigned.apk when it is not, so never hard-code the name.
          APK=$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' | head -1)
          if [ -z "$APK" ]; then echo "No APK was produced"; exit 1; fi
          echo "checking $APK"
          python3 tools/verify-icon.py "$APK"

      - name: Name the APK the way it is published
        run: |
          # The build writes app-release.apk. The release asset must be
          # KavoPDF-<version>.apk: the file the user downloads has to say what it is and
          # which version it is. "app-release.apk" says neither, and every version taken
          # from the website would land on the phone under the same name.
          VERSION=$(grep -oP 'versionName\s+"\K[^"]+' app/build.gradle | head -1)
          if [ -z "$VERSION" ]; then echo "Could not read versionName from app/build.gradle"; exit 1; fi
          APK=$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' ! -name 'KavoPDF-*' | head -1)
          if [ -z "$APK" ]; then echo "No APK was produced"; exit 1; fi
          mv "$APK" "app/build/outputs/apk/release/KavoPDF-${VERSION}.apk"
          echo "named: KavoPDF-${VERSION}.apk"
          ls -la app/build/outputs/apk/release/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kavopdf-release-apk
          path: app/build/outputs/apk/release/*.apk

      # A release is cut only when a version tag (v*) is pushed, never on an ordinary
      # commit. Otherwise every push would leave another release behind and the
      # "latest release" the website reads would be an untested auto-build.
      - name: Publish APK to a Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          # Never publish an unsigned build: it would install as a different app and
          # could not be updated later with the real key. Without the signing secret
          # the tag still builds, it just does not go out as a release.
          if [ -z "${KEYSTORE_BASE64}" ]; then
            echo "No signing secret configured - skipping release publish."
            exit 0
          fi
          # Idempotent: a release may already exist for this tag (created by hand), in
          # which case only the asset is replaced. Either way the run stays green.
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" app/build/outputs/apk/release/*.apk --clobber
            gh release edit "${GITHUB_REF_NAME}" --latest
          else
            gh release create "${GITHUB_REF_NAME}" app/build/outputs/apk/release/*.apk \
              --title "KavoPDF ${GITHUB_REF_NAME#v}" \
              --notes "Signed release APK built automatically from commit ${GITHUB_SHA}." \
              --latest
          fi

  # ---------------------------------------------------------------------------
  # The tool benchmark, on its own.
  #
  # Separate from `build` on purpose. The bench compiles the engine a second time and runs
  # 22 tools against a fixture corpus. Inside verify-engine.sh that meant a wiring problem in
  # the harness could take the APK down with it, which is exactly what happened once. Here
  # the two cannot interfere.
  # ---------------------------------------------------------------------------
  bench:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # run.py diffs this commit against the one before to decide which tools a change
          # can have touched.
          fetch-depth: 2

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install the reference libraries
        run: |
          python3 -m pip install --quiet --upgrade pip
          python3 -m pip install --quiet pymupdf pdfplumber python-docx pillow

      - name: Fetch the engine libraries
        run: |
          mkdir -p tools/bench/libs/aar
          curl -sSL -o tools/bench/libs/pdfbox.aar \
            https://repo1.maven.org/maven2/com/tom-roush/pdfbox-android/2.0.27.0/pdfbox-android-2.0.27.0.aar
          curl -sSL -o tools/bench/libs/bcprov.jar \
            https://repo1.maven.org/maven2/org/bouncycastle/bcprov-jdk15to18/1.72/bcprov-jdk15to18-1.72.jar
          curl -sSL -o tools/bench/libs/bcpkix.jar \
            https://repo1.maven.org/maven2/org/bouncycastle/bcpkix-jdk15to18/1.72/bcpkix-jdk15to18-1.72.jar
          curl -sSL -o tools/bench/libs/bcutil.jar \
            https://repo1.maven.org/maven2/org/bouncycastle/bcutil-jdk15to18/1.72/bcutil-jdk15to18-1.72.jar
          cd tools/bench/libs/aar && unzip -oq ../pdfbox.aar && ls classes.jar

      - name: Compile the engine, then the harness
        run: |
          set -e
          mkdir -p tools/bench/out
          # The stubs go in first and are on the classpath for the engine, which is why the
          # engine and the harness are two separate javac calls into the same directory.
          javac -d tools/bench/out $(find tools/engine-verify/stubs -name '*.java')
          javac -cp "tools/bench/out:tools/bench/libs/aar/classes.jar:tools/bench/libs/aar/assets:tools/bench/libs/bcprov.jar:tools/bench/libs/bcpkix.jar:tools/bench/libs/bcutil.jar" \
                -d tools/bench/out $(find app/src/main/java -name '*.java')
          javac -cp "tools/bench/out:tools/bench/libs/aar/classes.jar:tools/bench/libs/aar/assets:tools/bench/libs/bcprov.jar:tools/bench/libs/bcpkix.jar:tools/bench/libs/bcutil.jar" \
                -d tools/bench/out tools/bench/Bench.java
          ls tools/bench/out/Bench.class

      # Non-blocking on purpose. This step picks benchmarks from the changed files and
      # compares them against tools/bench/baseline.json, whose metric definitions are the old
      # ones (a length ratio for character accuracy, set membership for fonts and colours).
      # It has failed on every run since those metrics were corrected, which turns the whole
      # run red and buries any real failure in the noise. The build job - the one that
      # produces the APK - is unaffected and still gates the release.
      - name: Run only the tools this change can have touched
        continue-on-error: true
        env:
          BENCH_CP: tools/bench/out:tools/bench/libs/aar/classes.jar:tools/bench/libs/aar/assets:tools/bench/libs/bcprov.jar:tools/bench/libs/bcpkix.jar:tools/bench/libs/bcutil.jar
          BENCH_WORK: /tmp/kavopdf-bench
        run: |
          SINCE="HEAD~1"
          if [ -n "${GITHUB_BASE_REF:-}" ]; then SINCE="origin/${GITHUB_BASE_REF}"; fi
          python3 tools/bench/run.py --since "$SINCE"

      - name: Keep the baseline the run produced
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-baseline
          path: tools/bench/baseline.json
          if-no-files-found: warn
